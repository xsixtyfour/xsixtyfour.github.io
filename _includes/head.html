<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'self'; child-src 'self'; form-action 'none'; base-uri 'self'" />
  <meta http-equiv="X-XSS-Protection" content="1;mode=block" always>
  <meta http-equiv="Referrer-Policy" content="no-referrer, strict-origin-when-cross-origin">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  <title>{{ page.title }}</title>
  {%- seo title=false -%}
  {% if page.robots %}
    <meta name="robots" content="{{page.robots}}" />
  {% endif %}
  {%- if site.listen_for_clients_preferred_style -%}
    <link rel="stylesheet" type="text/css" href="{{ "/assets/main.css" | relative_url }}">
  {%- else -%}
    {%- if site.style == 'light' -%}
      <link rel="stylesheet" type="text/css" href="{{ "/assets/main-light.css" | relative_url }}">
    {%- elsif site.style == 'hacker' -%}
      <link rel="stylesheet" type="text/css" href="{{ "/assets/main-hacker.css" | relative_url }}">
    {%- else -%}
      <link rel="stylesheet" type="text/css" href="{{ "/assets/main-dark.css" | relative_url }}">
    {%- endif -%}
  {%- endif -%}
  <link rel="stylesheet" type="text/css" href="{{ "/assets/mocha.css" | relative_url }}">
  <style>
    code, pre, .highlight {
      font-family: 'JetBrains Mono', monospace !important;
    }
    .cursor-blink {
      animation: blink 1s step-end infinite !important;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
  <script src="{{ "/assets/typing.js" | relative_url }}"></script>
  <script src="{{ "/assets/theme-toggle.js" | relative_url }}"></script>
</head>
